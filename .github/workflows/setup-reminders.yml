name: Set up reminders

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - env:
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
        run: python tools/setup_reminders.py
