name: Check hotels

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-hotels
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt playwright==1.48.0 && python -m playwright install --with-deps chromium

      - name: Check hotels
        env:
          NTFY_TOPIC_HOTELS: ${{ secrets.NTFY_TOPIC_HOTELS }}
        run: python hotels.py

      - name: Save hotel prices
        run: |
          if [ -n "$(git status --porcelain hotel_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add hotel_state.json
            git commit -m "Update hotel prices"
            git pull --rebase origin master
            git push
          fi
